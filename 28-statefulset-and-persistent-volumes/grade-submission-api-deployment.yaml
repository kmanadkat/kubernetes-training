apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api
  namespace: grade-submission
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-submission-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: grade-submission-api
    spec:
      containers:
        - name: grade-submission-api
          image: rslim087/kubernetes-course-grade-submission-api:stateless-v2
          env:
            - name: MONGODB_HOST
              value: mongodb # Name of the service
            - name: MONGODB_PORT
              value: "27017" # Service Port
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15 # wait for app to start before probing
            periodSeconds: 5 # probe every 5s after initial delay
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5 # probe every 5s
          resources:
            requests:
              memory: '128Mi'
              cpu: '128m'
            limits:
              memory: '128Mi'
          ports:
            - containerPort: 3000
